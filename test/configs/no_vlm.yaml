# Ban sao cua apc/configs/qwenvl2_5_7b_instruct.yaml, chi doi use_vlm_refinement: false
# (dung cho test/test_vision_modules.py va test/run_apc_no_vlm.py, khong co VLM).
# Option R1-R4 giu gia tri mac dinh = hanh vi goc.
vlm:
  type: qwenvl2_5
  pretrained_model: Qwen/Qwen2.5-VL-7B-Instruct
  model_name: llava_llama3
  conv_template: llava_llama_3
  do_sample: false
  temperature: 0.0
  max_new_tokens: 512
  response_role: system

detection:
  ckpt_path: apc/vision_modules/src/checkpoints/groundingdino_swint_ogc.pth
  box_threshold: 0.05
  text_threshold: 0.05
  num_candidates: 5
  use_vlm_refinement: false
  refinement_parse: substring

segmentation:
  ckpt_path: apc/vision_modules/src/checkpoints/sam_vit_h_4b8939.pth

depth:
  ckpt_path: apc/vision_modules/src/checkpoints/depth_pro.pt
  use_estimated_focal: false
  mode_filter_ratio: 0.1

orientation:
  ckpt_path: apc/vision_modules/src/checkpoints
